name: Build Red Special Full V3 Documents

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'artifact_v3/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install python-docx
      - name: Build Word package
        run: python artifact_v3/build_v3.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: red-special-full-v3-documents
          path: artifact_v3/output/**
          if-no-files-found: error
          retention-days: 7
