name: Build Secretary 15 Optimized Documents

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'artifact_build_15/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk poppler-utils
          pip install python-docx pillow
      - name: Build fifteen Word documents
        run: python artifact_build_15/main.py
      - name: Render every document and run QA
        run: python artifact_build_15/qa_render.py
      - name: Upload editable Word package
        uses: actions/upload-artifact@v4
        with:
          name: secretary-15-documents-optimized
          path: artifact_build_15/output/开江中学实验学校党委书记15份参考文件优化完善稿/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload QA package
        uses: actions/upload-artifact@v4
        with:
          name: secretary-15-documents-qa
          path: artifact_build_15/qa/**
          if-no-files-found: error
          retention-days: 7
      - name: Publish contact sheets to a temporary QA branch
        env:
          QA_BRANCH: qa-secretary-15docs-optimized-20260727
        run: |
          mkdir -p /tmp/qa_publish
          cp -r artifact_build_15/qa/contact_sheets /tmp/qa_publish/contact_sheets
          cp artifact_build_15/qa/QA_REPORT.txt /tmp/qa_publish/QA_REPORT.txt
          cp artifact_build_15/qa/ALL_CONTACT_SHEETS.pdf /tmp/qa_publish/ALL_CONTACT_SHEETS.pdf
          git config user.name "chatgpt-artifact-builder"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan "$QA_BRANCH"
          git rm -rf .
          mkdir -p qa_generated
          cp -r /tmp/qa_publish/* qa_generated/
          git add qa_generated
          git commit -m "Publish temporary contact sheets for visual QA"
          git push --force origin "HEAD:$QA_BRANCH"
