name: Build Alliance Meeting Documents

on:
  push:
    branches:
      - main
    paths:
      - 'chatgpt-docs/generate_alliance_meeting_docs.py'
      - '.github/workflows/chatgpt-build-alliance-meeting-docs.yml'

permissions:
  contents: write

jobs:
  build-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip python-docx lxml

      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk >/dev/null

      - name: Generate Word documents
        run: python chatgpt-docs/generate_alliance_meeting_docs.py

      - name: Render documents for visual review
        run: |
          mkdir -p chatgpt-docs/output/pdf chatgpt-docs/output/preview_01 chatgpt-docs/output/preview_02
          libreoffice --headless --convert-to pdf --outdir chatgpt-docs/output/pdf "downloads/01_关于商请重庆建筑工程职业学院承办联盟成立大会并共同推进首批建设任务的函.docx"
          libreoffice --headless --convert-to pdf --outdir chatgpt-docs/output/pdf "downloads/02_联盟成立大会会务安排及筹备任务清单.docx"
          pdftoppm -png -r 120 "chatgpt-docs/output/pdf/01_关于商请重庆建筑工程职业学院承办联盟成立大会并共同推进首批建设任务的函.pdf" chatgpt-docs/output/preview_01/page
          pdftoppm -png -r 120 "chatgpt-docs/output/pdf/02_联盟成立大会会务安排及筹备任务清单.pdf" chatgpt-docs/output/preview_02/page

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: alliance-meeting-documents
          path: |
            downloads/01_关于商请重庆建筑工程职业学院承办联盟成立大会并共同推进首批建设任务的函.docx
            downloads/02_联盟成立大会会务安排及筹备任务清单.docx
            chatgpt-docs/output/pdf/*.pdf
            chatgpt-docs/output/preview_01/*.png
            chatgpt-docs/output/preview_02/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated documents and previews
        run: |
          git config user.name "ChatGPT Document Builder"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/*.docx chatgpt-docs/output/pdf/*.pdf chatgpt-docs/output/preview_01/*.png chatgpt-docs/output/preview_02/*.png
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "[skip ci] Generate alliance meeting documents"
            git push origin main
          fi
